services:
  e2e-test:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - maven-cache:/root/.m2
      - ${CMT_CONSOLE_HOME:?Set CMT_CONSOLE_HOME to the extracted CMT Console directory}:/opt/cmt-console
      # Mount the whole project so /app/target is a normal directory, not a bind mount root.
      # `mvn clean` cannot delete a mount point such as a separately mounted /app/target.
      - ./:/app
    environment:
      - CMT_CONSOLE_HOME=/opt/cmt-console
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
      - TESTCONTAINERS_RYUK_DISABLED=true
      # Oracle 11g XE ships an old timezone file (v4) that does not recognize
      # newer region IDs such as Asia/Seoul. If ojdbc8(21.x) sends the JVM
      # timezone as a region name during authentication, ORA-01882 is raised.
      # Set this to false so the driver sends a UTC offset (+09:00) instead.
      - JAVA_TOOL_OPTIONS=-Doracle.jdbc.timezoneAsRegion=false
    # The Tibero scenario reads e2e.tibero.license from e2e-test.properties.
    # That file is shared with host-side `mvn test` runs (where it holds a macOS
    # absolute path), so we override it here with the container-side path —
    # system property wins over file (E2eTestProperties precedence). Without
    # this override, Files.exists() in TiberoEnvironment.isAvailable() fails
    # and the whole Tibero scenario skips.
    command: >
      mvn clean test
      -Dmaven.test.failure.ignore=true
      -Dpicocli.ansi=false
      -Dorg.fusesource.jansi.Ansi.disable=true
      -De2e.tibero.license=/app/tibero/license.xml

volumes:
  maven-cache:
