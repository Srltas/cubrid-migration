name: github-checks
on:
  pull_request:
    branches:
      - develop
      - release/**
      - pr-test-main

jobs:
  license:
    name: license
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v2
      - uses: jitterbit/get-changed-files@v1
        id: files
        continue-on-error: true
      - name: Check license
        run: |
          set +e
          license_headers=.github/workflows/license_headers
          result="PASS"

          for f in ${{ steps.files.outputs.added_modified }}; do
            if [ -d "$f" ]; then
              continue
            fi

            ext=$(expr $f : ".*\(\..*\)")
            case $ext in
            .java) true;;
            *) continue ;;
            esac

            result_for_f="FAIL"
            for header in `find $license_headers -type f`; do
              line_cnt=`wc -l < $header`
              head -n $line_cnt $f | diff -q -w - $header 2>&1 1>/dev/null
              if [ $? -eq 0 ]; then
                result_for_f="PASS"
                break
              fi
            done

            echo "$f: $result_for_f"
            if [ "$result_for_f" = "FAIL" ]; then
              result="FAIL"
            fi
          done
          
          test $result = "PASS"
  pr-style:
    name: pr-style
    runs-on: ubuntu-latest
    steps:
      - uses: deepakputhraya/action-pr-title@master
        with:
          regex: '^\[[A-Z]+-\d+\]\s.+'
  code-style:
    name: code-style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - id: files
        uses: jitterbit/get-changed-files@v1
        continue-on-error: true
      - name: Diagnose GitHub API rate limits (unauthenticated vs authenticated)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "== Unauthenticated rate limit headers =="
          curl -sI https://api.github.com/rate_limit | tr -d '\r' | grep -i '^X-RateLimit' || true

          echo "== Unauthenticated body: core =="
          curl -s https://api.github.com/rate_limit | jq '.resources.core' || true

          echo "== Probe release tag (unauthenticated) =="
          curl -s -D - https://api.github.com/repos/google/google-java-format/releases/tags/google-java-format-1.7 -o /dev/null \
            | tr -d '\r' | sed -n '1,20p' || true

          echo "== Authenticated rate limit headers =="
          curl -sI -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit \
            | tr -d '\r' | grep -i '^X-RateLimit' || true

          echo "== Authenticated body: core =="
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/rate_limit \
            | jq '.resources.core' || true

          echo "== Probe release tag (authenticated) =="
          curl -s -D - -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/google/google-java-format/releases/tags/google-java-format-1.7 -o /dev/null \
            | tr -d '\r' | sed -n '1,20p' || true

          echo "== Release first pages =="
          curl -s https://api.github.com/repos/google/google-java-format/releases \
            | jq -r '.[].name'

          echo "== Release 4 pages =="
          curl -s 'https://api.github.com/repos/google/google-java-format/releases?per_page=100&page=4' \
            | jq -r '.[].name'

      - uses: axel-op/googlejavaformat-action@v4
        with:
          release-name: 1.28.0
          args: "--aosp --replace --set-exit-if-changed"
          files: ${{ steps.files.outputs.added_modified }}
          skip-commit: true
  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - run: mvn build -Pdesktop
