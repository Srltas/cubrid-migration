name: E2E Test

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - '**'
  schedule:
    # Nightly at 2:00 AM UTC
    - cron: '0 2 * * *'
  # Manual trigger from the GitHub Actions UI. Useful for ad-hoc test
  # runs against a feature branch (no PR required) and for debugging
  # workflow changes before opening a PR.
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Console
        run: chmod +x build.sh && ./build.sh -p c

      - name: Provision Console
        run: |
          mkdir -p cmt-console
          tar xzf target/CUBRID-Migration-Toolkit-console-*.tar.gz \
            --strip-components=1 -C cmt-console
          chmod +x cmt-console/migration.sh
          echo "CMT_CONSOLE_HOME=$GITHUB_WORKSPACE/cmt-console" >> $GITHUB_ENV

      - name: Run E2E Tests
        working-directory: tests/e2e
        env:
          NO_COLOR: '1'
          CLICOLOR: '0'
          TERM: dumb
          # Oracle 11g XE ships an old timezone file (v4) that does not
          # recognize newer region IDs (UTC, Asia/Seoul, ...). If ojdbc8
          # sends the JVM timezone as a region name during authentication,
          # Oracle raises "ORA-01882: timezone region not found".
          #
          # Forcing the driver to send a numeric UTC offset (e.g. +00:00)
          # instead bypasses the lookup. JAVA_TOOL_OPTIONS is honored by
          # every child JVM (Maven, Surefire fork, the migration.sh CMT
          # process), so the property reaches the actual JDBC connection
          # site even though that runs in a separate process tree.
          # docker-compose.yml has the same setting for local runs.
          JAVA_TOOL_OPTIONS: -Doracle.jdbc.timezoneAsRegion=false
        run: |
          mvn -B clean test \
            -Dmaven.test.failure.ignore=true \
            -Dpicocli.ansi=false \
            -Dorg.fusesource.jansi.Ansi.disable=true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: E2E Test Results
          files: tests/e2e/target/surefire-reports/*.xml
          # 'failures' keeps the PR conversation clean: no comment when the
          # suite is green, only when there is something to act on.
          # ('always' previously added a fresh comment on every no-op
          # rebase / force-push.)
          comment_mode: failures
          report_individual_runs: true
          check_run_annotations: all tests, skipped tests
          action_fail: true
          action_fail_on_inconclusive: true

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tests/e2e/target/surefire-reports/**
          if-no-files-found: ignore

      # Per-test artifact dirs (resolved script.xml, test.log, captured
      # dump output, diff.patch when goldens fail). Uploaded only on
      # failure — surefire XML tells you WHICH test failed; this tells
      # you WHY by giving the migration log and the dump-vs-golden diff.
      - name: Upload E2E Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: tests/e2e/target/e2e/**
          if-no-files-found: ignore
