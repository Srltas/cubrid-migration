name: E2E Test

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - '**'
  schedule:
    # Nightly at 2:00 AM UTC
    - cron: '0 2 * * *'

jobs:
  e2e:
    name: E2E Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Console
        run: chmod +x build.sh && ./build.sh -p c

      - name: Provision Console
        run: |
          mkdir -p cmt-console
          tar xzf target/CUBRID-Migration-Toolkit-console-*.tar.gz \
            --strip-components=1 -C cmt-console
          chmod +x cmt-console/migration.sh
          echo "CMT_CONSOLE_HOME=$GITHUB_WORKSPACE/cmt-console" >> $GITHUB_ENV
          echo "Console provisioned: $(ls cmt-console/migration.sh)"

      - name: Run E2E Tests
        working-directory: tests/e2e
        env:
          NO_COLOR: '1'
          CLICOLOR: '0'
          TERM: dumb
        run: |
          mvn test \
            -Dmaven.test.failure.ignore=true \
            -Dpicocli.ansi=false \
            -Dorg.fusesource.jansi.Ansi.disable=true

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Results
          path: tests/e2e/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/target/e2e/**/diff.patch
            tests/e2e/target/e2e/**/actual.log
            tests/e2e/target/e2e/**/expected.log
          if-no-files-found: ignore

      - name: Attach diff to Summary
        if: always()
        working-directory: tests/e2e
        run: |
          echo "## E2E Diff Report" >> $GITHUB_STEP_SUMMARY
          echo ""  >> $GITHUB_STEP_SUMMARY

          echo "::group::Debug: listing target/e2e"
          find target/e2e -type f 2>/dev/null || echo "target/e2e directory not found"
          echo "::endgroup::"

          found=false
          while IFS= read -r -d '' diff_file; do
            found=true
            test_name="${diff_file#target/e2e/}"
            test_name="${test_name%/diff.patch}"
            echo "### :x: ${test_name}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # expected vs actual
            dir=$(dirname "$diff_file")
            if [ -f "$dir/expected.log" ]; then
              echo "<details><summary>Expected</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              head -100 "$dir/expected.log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -f "$dir/actual.log" ]; then
              echo "<details><summary>Actual</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              head -100 "$dir/actual.log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            echo '```diff' >> $GITHUB_STEP_SUMMARY
            head -200 "$diff_file" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done < <(find target/e2e -name "diff.patch" -print0 2>/dev/null)

          if [ "$found" = false ]; then
            echo ":white_check_mark: All tests passed — no diffs." >> $GITHUB_STEP_SUMMARY
          fi
