name: E2E Test

on:
  pull_request:
    branches:
      - develop
      - release/**

  # 수동 실행도 가능하도록
  workflow_dispatch:

jobs:
  e2e-test:
    name: CMT Console E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ── 1. CMT Console 소스 checkout (PR 브랜치 코드) ──
      - name: Checkout CMT Console
        uses: actions/checkout@v4

      # ── 2. Java 21 설정 (CMT Console 빌드용) ──
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ── 3. CMT Console 빌드 (console 프로필만) ──
      - name: Build CMT Console
        run: |
          chmod +x build.sh
          ./build.sh -p console

      # ── 4. 빌드된 Console 바이너리 압축 해제 ──
      - name: Extract CMT Console binary
        run: |
          mkdir -p /tmp/cmt-console
          tar xzf target/CUBRID-Migration-Toolkit-console-*.tar.gz \
              -C /tmp/cmt-console --strip-components=1
          chmod +x /tmp/cmt-console/migration.sh
          echo "--- CMT Console contents ---"
          ls -la /tmp/cmt-console/

      # ── 5. E2E 테스트 저장소 checkout ──
      - name: Checkout E2E Tests
        uses: actions/checkout@v4
        with:
          repository: Srltas/cmt_e2e_smoke_poc
          ref: main
          path: e2e

      # ── 6. E2E 테스트 실행 ──
      - name: Run E2E Tests
        working-directory: e2e
        env:
          CMT_CONSOLE_HOME: /tmp/cmt-console
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          NO_COLOR: '1'
        run: |
          mvn test \
              -Dmaven.test.failure.ignore=true \
              -Dpicocli.ansi=false \
              -Dorg.fusesource.jansi.Ansi.disable=true

      # ── 7. 테스트 결과 리포트 (PR에 표시) ──
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Results
          path: e2e/target/surefire-reports/*.xml
          reporter: java-junit

      # ── 8. 실패 시 진단 아티팩트 보관 ──
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-artifacts
          path: |
            e2e/target/e2e/**/diff.patch
            e2e/target/e2e/**/actual.log
            e2e/target/e2e/**/expected.log
            e2e/target/e2e/**/diagnostic-log.txt
            e2e/target/surefire-reports/*.xml
          retention-days: 14
          if-no-files-found: ignore
