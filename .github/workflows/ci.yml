name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede themselves; every develop push gets its own group so a later
  # merge cannot cancel an earlier commit's verification before it reports.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Desktop
        run: chmod +x build.sh && ./build.sh -p d

  build-console:
    name: build-console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Console
        run: chmod +x build.sh && ./build.sh -p c

      - name: Upload Console tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cmt-console-tarball
          path: target/CUBRID-Migration-Toolkit-console-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  unit-test:
    name: unit-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B -Punit-test test

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surefire-reports-unit
          path: tests/unit-test/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: otr-unit
          path: tests/unit-test/target/open-test-report/**
          if-no-files-found: ignore

      - name: Build TC catalog
        if: always()
        run: |
          mvn -B -q -Punit-test test \
            -Djunit.platform.execution.dryRun.enabled=true \
            -Djunit.platform.reporting.output.dir=target/catalog-otr \
            -Dsurefire.reportsDirectory=target/catalog-dryrun-reports
          python3 .github/scripts/build_catalog.py \
            --type unit --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --all tests/unit-test/target/catalog-otr/open-test-report.xml \
            -o catalog-unit.json

      - name: Upload TC catalog
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalog-unit
          path: catalog-unit.json
          if-no-files-found: error

  catalog-e2e:
    name: catalog-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build TC catalog
        run: |
          set -euo pipefail
          dry() {
            local out="$1"; shift
            mvn -B -q -f tests/e2e/pom.xml test \
              -Djunit.platform.execution.dryRun.enabled=true \
              -Djunit.platform.reporting.output.dir="target/$out" \
              -Dsurefire.reportsDirectory=target/catalog-dryrun-reports \
              -Dsurefire.failIfNoSpecifiedTests=false "$@"
          }
          dry otr-all

          # ciExecuted is derived by selecting with each job's own -Dtest pattern, read from the
          # matrix below, so surefire decides what CI covers and the two cannot drift.
          # Anchored to the start of a line so this step's own grep does not match itself.
          selected=()
          count=0
          while read -r pattern; do
            case "$pattern" in
              *Test) ;;
              *) echo "::error::unexpected -Dtest pattern from ci.yml: $pattern"; exit 1 ;;
            esac
            count=$((count + 1))
            dry "otr-$count" -Dtest="$pattern"
            selected+=(--selected "tests/e2e/target/otr-$count/open-test-report.xml")
          done < <(grep -oE "^ +tests: '[^']+'" .github/workflows/ci.yml | sed "s/^ *tests: '//;s/'$//")
          if [ "$count" -eq 0 ]; then
            echo "::error::no e2e matrix patterns found in ci.yml"
            exit 1
          fi

          python3 .github/scripts/build_catalog.py \
            --type e2e --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --all tests/e2e/target/otr-all/open-test-report.xml \
            "${selected[@]}" -o catalog-e2e.json

      - name: Upload TC catalog
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalog-e2e
          path: catalog-e2e.json
          if-no-files-found: error

  e2e-test:
    name: e2e-${{ matrix.name }}
    needs: build-console
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oracle
            tests: 'OracleTo*Test'
          - name: cubrid
            tests: 'CubridTo*Test'
          - name: mysql
            tests: 'MySqlTo*Test'
          - name: mariadb
            tests: 'MariaDbTo*Test'
          - name: informix
            tests: 'InformixTo*Test'
          - name: mssql
            tests: 'MsSqlTo*Test'
          - name: cli
            tests: 'Cli*Test'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download Console tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cmt-console-tarball
          path: target

      - name: Provision Console
        run: |
          mkdir -p cmt-console
          tar xzf target/CUBRID-Migration-Toolkit-console-*.tar.gz \
            --strip-components=1 -C cmt-console
          chmod +x cmt-console/migration.sh
          echo "CMT_CONSOLE_HOME=$GITHUB_WORKSPACE/cmt-console" >> "$GITHUB_ENV"

      - name: Run E2E Tests (${{ matrix.name }})
        working-directory: tests/e2e
        env:
          NO_COLOR: '1'
          CLICOLOR: '0'
          TERM: dumb
          # Oracle 11g XE tz file (v4) → ORA-01882 on newer region IDs
          # unless ojdbc sends UTC offset. Required for CMT subprocess.
          JAVA_TOOL_OPTIONS: -Doracle.jdbc.timezoneAsRegion=false
          TEST_PATTERN: ${{ matrix.tests }}
        run: |
          mvn -B clean test \
            -Dtest="$TEST_PATTERN" \
            -Dpicocli.ansi=false \
            -Dorg.fusesource.jansi.Ansi.disable=true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: always()
        continue-on-error: true
        with:
          check_name: E2E Results (${{ matrix.name }})
          files: tests/e2e/target/surefire-reports/*.xml
          comment_mode: failures
          report_individual_runs: true
          check_run_annotations: all tests, skipped tests
          action_fail: false
          action_fail_on_inconclusive: false

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surefire-reports-${{ matrix.name }}
          path: tests/e2e/target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: otr-${{ matrix.name }}
          path: tests/e2e/target/open-test-report/**
          if-no-files-found: ignore

      - name: Upload E2E Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-failure-artifacts-${{ matrix.name }}
          path: tests/e2e/target/e2e/**
          if-no-files-found: ignore
